name: Test AI Agent

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Запустить агента
        run: python agent.py
