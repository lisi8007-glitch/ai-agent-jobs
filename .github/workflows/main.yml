name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Тестирование классификатора
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              (
                  "Заявка на сантехника",
                  "Нужен сантехник, течёт труба",
                  True
              ),
              (
                  "Заявка на электрика",
                  "Ищу электрика, не работает розетка",
                  True
              ),
              (
                  "Заявка на плиточника",
                  "Посоветуйте плиточника для ванной",
                  True
              ),
              (
                  "Заявка на технику",
                  "Не работает стиральная машина, нужен мастер",
                  True
              ),
              (
                  "Аренда квартиры",
                  "Сдам квартиру в Святом Власе посуточно",
                  False
              ),
              (
                  "Продажа квартиры",
                  "Продам апартаменты в Солнечном берегу",
                  False
              ),
              (
                  "Вакансия",
                  "Требуется сантехник. Работа официальная.",
                  False
              ),
              (
                  "Реклама мастера",
                  "Сантехник, оказываю услуги по ремонту",
                  False
              )
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"\n{name}")
              print(f"Результат агента: {actual}")
              print(f"Ожидалось: {expected}")

              if actual != expected:
                  raise AssertionError(
                      f"ОШИБКА: {name}. "
                      f"Получено {actual}, "
                      f"ожидалось {expected}"
                  )

          print(
              "\n=== ВСЕ ТЕСТЫ КЛАССИФИКАТОРА ПРОЙДЕНЫ ==="
          )
          PY

      - name: Реальный поиск свежих заявок
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import search_web, analyze_ad
          from collections import Counter
          import time
          from datetime import datetime, timezone
          from urllib.parse import urlsplit, urlunsplit

          cities = [
              "Солнечный берег",
              "Святой Влас",
              "Равда",
              "Бургас",
              "Созополь",
              "Приморско",
              "Варна",
          ]

          query_templates = [
              '"{city}" "нужен сантехник"',
              '"{city}" "ищу сантехника"',
              '"{city}" "нужен электрик"',
              '"{city}" "ищу электрика"',
              '"{city}" "нужен мастер" ремонт',
              '"{city}" "ищу мастера" ремонт',
              '"{city}" "посоветуйте мастера" ремонт',
              '"{city}" "кто может" ремонт',
              '"{city}" "не работает" мастер',
              '"{city}" "сломался" мастер',
              '"{city}" "нужен плиточник"',
              '"{city}" "нужен мастер" бытовая техника',
          ]

          seen_urls = set()
          matches = []
          reason_counts = Counter()
          total_results = 0
          failed_queries = 0

          cutoff = datetime.now(timezone.utc).timestamp() - 5 * 24 * 60 * 60

          print("=== ПОИСК СВЕЖИХ ЗАЯВОК КЛИЕНТОВ ===")
          print(f"Городов: {len(cities)}")
          print(f"Запросов на город: {len(query_templates)}")
          print(
              f"Всего поисковых запросов: "
              f"{len(cities) * len(query_templates)}"
          )
          print("Период: последние 5 дней")

          for city in cities:
              for template in query_templates:

                  query = (
                      "site:facebook.com "
                      + template.format(city=city)
                      + ' -"оказываю услуги"'
                      + ' -"предлагаю услуги"'
                      + ' -"мои услуги"'
                      + ' -"услуги мастера"'
                      + ' -"сдам"'
                      + ' -"сдаю"'
                      + ' -"аренда"'
                      + ' -"продам"'
                      + ' -"продажа"'
                  )

                  print(f"\nПоиск: {query}")

                  try:
                      data = search_web(query)

                  except Exception as exc:
                      failed_queries += 1
                      print(f"Ошибка поиска: {exc}")
                      time.sleep(3)
                      continue

                  results = data.get("results", [])

                  print(
                      f"Результатов: {len(results)}"
                  )

                  for item in results:

                      title = item.get("title", "")
                      snippet = item.get("snippet", "")
                      url = item.get("url", "")

                      if not url:
                          continue

                      parsed = urlsplit(url)

                      normalized_url = urlunsplit(
                          (
                              parsed.scheme,
                              parsed.netloc,
                              parsed.path,
                              "",
                              ""
                          )
                      )

                      if normalized_url in seen_urls:
                          continue

                      seen_urls.add(normalized_url)
                      total_results += 1

                      text = f"{title} {snippet}"

                      result = analyze_ad(text)

                      if result["match"]:
                          matches.append(
                              {
                                  "city": city,
                                  "title": title,
                                  "snippet": snippet,
                                  "url": url
                              }
                          )

                      else:
                          reason_counts[
                              result["reason"]
                          ] += 1

                  time.sleep(3)

          print("\n=== ИТОГ ПОИСКА ===")
          print(
              f"Уникальных результатов: "
              f"{total_results}"
          )
          print(
              f"Подходящих заявок: "
              f"{len(matches)}"
          )
          print(
              f"Ошибок поисковых запросов: "
              f"{failed_queries}"
          )

          print("\n=== НАЙДЕННЫЕ ЗАЯВКИ ===")

          for item in matches:
              print("\n--- ЗАЯВКА ---")
              print(
                  f"Город: {item['city']}"
              )
              print(
                  f"Заголовок: {item['title']}"
              )
              print(
                  f"Описание: {item['snippet']}"
              )
              print(
                  f"Ссылка: {item['url']}"
              )

          print("\n=== ПРИЧИНЫ ОТКЛОНЕНИЯ ===")

          for reason, count in reason_counts.most_common():
              print(
                  f"{count} — {reason}"
              )

          print(
              "\n=== ЭТАП 1: ПОИСК ЗАВЕРШЁН ==="
          )
          PY
