name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Тестирование классификатора
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              (
                  "Заявка на сантехника",
                  "Нужен сантехник, течёт труба",
                  True
              ),
              (
                  "Заявка на электрика",
                  "Ищу электрика, не работает розетка",
                  True
              ),
              (
                  "Заявка на плиточника",
                  "Посоветуйте плиточника для ванной",
                  True
              ),
              (
                  "Заявка на технику",
                  "Не работает стиральная машина, нужен мастер",
                  True
              ),
              (
                  "Аренда квартиры",
                  "Сдам квартиру в Святом Власе посуточно",
                  False
              ),
              (
                  "Продажа квартиры",
                  "Продам апартаменты в Солнечном берегу",
                  False
              ),
              (
                  "Вакансия",
                  "Требуется сантехник. Работа официальная.",
                  False
              ),
              (
                  "Реклама мастера",
                  "Сантехник, оказываю услуги по ремонту",
                  False
              )
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"\n{name}")
              print(f"Результат агента: {actual}")
              print(f"Ожидалось: {expected}")

              if actual != expected:
                  raise AssertionError(
                      f"ОШИБКА: {name}. "
                      f"Получено {actual}, "
                      f"ожидалось {expected}"
                  )

          print(
              "\n=== ВСЕ ТЕСТЫ "
              "КЛАССИФИКАТОРА ПРОЙДЕНЫ ==="
          )
          PY

      - name: Реальный поиск и проверка публикаций
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import (
              search_web,
              fetch_web,
              analyze_ad,
              is_facebook_post_url,
              get_published_date,
              get_fetched_text,
              is_fresh_publication
          )

          from collections import Counter
          import time
          from urllib.parse import urlsplit, urlunsplit

          cities = [
              "Солнечный берег",
              "Святой Влас",
              "Равда",
              "Бургас",
              "Созополь",
              "Приморско",
              "Варна"
          ]

          query_templates = [
              '"{city}" "нужен сантехник"',
              '"{city}" "ищу сантехника"',
              '"{city}" "нужен электрик"',
              '"{city}" "ищу электрика"',
              '"{city}" "нужен плиточник"',
              '"{city}" "нужен мастер" ремонт',
              '"{city}" "ищу мастера" ремонт',
              '"{city}" "посоветуйте мастера" ремонт',
              '"{city}" "кто может" ремонт',
              '"{city}" "не работает" мастер',
              '"{city}" "сломался" мастер',
              '"{city}" "нужен мастер" мебель',
              '"{city}" "нужен мастер" двери окна',
              '"{city}" "нужен мастер" кондиционер',
              '"{city}" "нужен мастер" бойлер',
              '"{city}" "нужен мастер" бытовая техника'
          ]

          seen_urls = set()
          candidates = []
          matches = []
          reason_counts = Counter()

          search_errors = 0
          fetch_errors = 0

          print(
              "=== ПОИСК И ПРОВЕРКА "
              "РЕАЛЬНЫХ ПОСТОВ ==="
          )

          print(
              f"Городов: {len(cities)}"
          )

          print(
              f"Запросов на город: "
              f"{len(query_templates)}"
          )

          total_queries = (
              len(cities)
              * len(query_templates)
          )

          print(
              f"Всего поисковых запросов: "
              f"{total_queries}"
          )

          print(
              "Период: последние 5 дней"
          )

          for city in cities:

              for template in query_templates:

                  query = (
                      "site:facebook.com "
                      + template.format(city=city)
                      + ' -"оказываю услуги"'
                      + ' -"предлагаю услуги"'
                      + ' -"мои услуги"'
                      + ' -"услуги мастера"'
                      + ' -"сдам"'
                      + ' -"сдаю"'
                      + ' -"аренда"'
                      + ' -"продам"'
                      + ' -"продажа"'
                  )

                  print(
                      f"\nПОИСК: {query}"
                  )

                  try:
                      data = search_web(query)

                  except Exception as exc:
                      search_errors += 1
                      print(
                          f"Ошибка поиска: {exc}"
                      )
                      time.sleep(3)
                      continue

                  results = data.get(
                      "results",
                      []
                  )

                  for item in results:

                      url = item.get(
                          "url",
                          ""
                      )

                      if not is_facebook_post_url(
                          url
                      ):
                          continue

                      parsed = urlsplit(url)

                      normalized_url = (
                          urlunsplit(
                              (
                                  parsed.scheme,
                                  parsed.netloc,
                                  parsed.path,
                                  "",
                                  ""
                              )
                          )
                      )

                      if normalized_url in seen_urls:
                          continue

                      seen_urls.add(
                          normalized_url
                      )

                      candidates.append(
                          {
                              "city": city,
                              "url": url
                          }
                      )

                  time.sleep(2)

          print(
              f"\nКандидатов на проверку: "
              f"{len(candidates)}"
          )

          for start in range(
              0,
              len(candidates),
              10
          ):

              batch = candidates[
                  start:start + 10
              ]

              urls = [
                  item["url"]
                  for item in batch
              ]

              print(
                  f"\n=== ПРОВЕРКА ПОСТОВ "
                  f"{start + 1}-"
                  f"{start + len(batch)} ==="
              )

              try:
                  fetch_data = fetch_web(
                      urls
                  )

              except Exception as exc:
                  fetch_errors += len(
                      batch
                  )

                  print(
                      f"Ошибка Fetch: {exc}"
                  )

                  time.sleep(5)
                  continue

              fetched_results = (
                  fetch_data.get(
                      "results",
                      []
                  )
              )

              fetched_map = {}

              for item in fetched_results:

                  url = item.get(
                      "url",
                      ""
                  )

                  if url:
                      fetched_map[url] = item

              for candidate in batch:

                  url = candidate["url"]
                  city = candidate["city"]

                  fetched = (
                      fetched_map.get(url)
                  )

                  if not fetched:
                      reason_counts[
                          "TinyFish Fetch не вернул настоящий пост."
                      ] += 1
                      continue

                  published_date = (
                      get_published_date(
                          fetched
                      )
                  )

                  if not published_date:
                      reason_counts[
                          "Не удалось подтвердить дату публикации."
                      ] += 1
                      continue

                  if not is_fresh_publication(
                      published_date,
                      days=5
                  ):
                      reason_counts[
                          "Публикация старше 5 дней."
                      ] += 1
                      continue

                  text = get_fetched_text(
                      fetched
                  )

                  if not text:
                      reason_counts[
                          "Не удалось получить текст настоящего поста."
                      ] += 1
                      continue

                  result = analyze_ad(text)

                  if not result["match"]:
                      reason_counts[
                          result["reason"]
                      ] += 1
                      continue

                  text_lower = text.lower()

                  city_found = (
                      city.lower()
                      in text_lower
                  )

                  if not city_found:

                      local_words = [
                          "несебр",
                          "несебър",
                          "свети влас",
                          "святой влас",
                          "солнечный берег",
                          "сунny beach",
                          "равда",
                          "бургас",
                          "созополь",
                          "созопол",
                          "приморско",
                          "варна"
                      ]

                      if not any(
                          word in text_lower
                          for word in local_words
                      ):
                          reason_counts[
                              "В тексте поста не подтверждена нужная локация."
                          ] += 1
                          continue

                  title = fetched.get(
                      "title",
                      ""
                  )

                  matches.append(
                      {
                          "city": city,
                          "title": title,
                          "published_date":
                              published_date.isoformat(),
                          "text": text[:4000],
                          "url": url
                      }
                  )

              time.sleep(2)

          print(
              "\n=== ИТОГ ПРОВЕРКИ ==="
          )

          print(
              f"Всего кандидатов: "
              f"{len(candidates)}"
          )

          print(
              f"Настоящих свежих заявок: "
              f"{len(matches)}"
          )

          print(
              f"Ошибок поиска: "
              f"{search_errors}"
          )

          print(
              f"Ошибок Fetch: "
              f"{fetch_errors}"
          )

          print(
              "\n=== ТОЛЬКО РЕАЛЬНЫЕ "
              "СВЕЖИЕ ЗАЯВКИ ==="
          )

          for item in matches:

              print(
                  "\n--- ЗАЯВКА ---"
              )

              print(
                  f"Город: "
                  f"{item['city']}"
              )

              print(
                  f"Дата: "
                  f"{item['published_date']}"
              )

              print(
                  f"Заголовок: "
                  f"{item['title']}"
              )

              print(
                  f"Текст: "
                  f"{item['text']}"
              )

              print(
                  f"Ссылка: "
                  f"{item['url']}"
              )

          print(
              "\n=== ПРИЧИНЫ ОТКЛОНЕНИЯ ==="
          )

          for reason, count in (
              reason_counts.most_common()
          ):
              print(
                  f"{count} — {reason}"
              )

          print(
              "\n=== ЭТАП 2: "
              "ПРОВЕРКА НАСТОЯЩИХ ПОСТОВ "
              "ЗАВЕРШЕН ==="
          )
          PY
