name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Тестирование классификатора
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              (
                  "Заявка на замену смесителя",
                  "Нужно заменить смеситель в квартире",
                  True
              ),
              (
                  "Поиск мастера для плитки",
                  "Ищу мастера для укладки плитки",
                  True
              ),
              (
                  "Заявка сантехнику",
                  "Нужен сантехник, течёт труба",
                  True
              ),
              (
                  "Вакансия сантехника",
                  "Требуется сантехник. Работа официальная.",
                  False
              ),
              (
                  "Мастер предлагает услуги",
                  "Сантехник: оказываю услуги по ремонту",
                  False
              )
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"\n{name}")
              print(f"Результат агента: {actual}")
              print(f"Ожидалось: {expected}")

              if actual != expected:
                  raise AssertionError(
                      f"ОШИБКА: {name}. "
                      f"Получено {actual}, "
                      f"ожидалось {expected}"
                  )

          print(
              "\n=== ВСЕ ТЕСТЫ КЛАССИФИКАТОРА "
              "ПРОЙДЕНЫ ==="
          )
          PY

      - name: Реальный многозапросный поиск TinyFish
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import search_web, analyze_ad
          from collections import Counter
          import time
          from urllib.parse import urlsplit, urlunsplit

          cities = [
              "Солнечный берег",
              "Святой Влас",
              "Равда",
              "Бургас",
              "Созополь",
              "Приморско",
              "Варна",
          ]

          query_templates = [
              '"{city}" "нужен мастер" сантехник',
              '"{city}" "ищу мастера" ремонт',
              '"{city}" "посоветуйте мастера" ремонт',
              '"{city}" "не работает" мастер',
          ]

          seen_urls = set()
          matches = []
          reason_counts = Counter()
          total_results = 0

          print("=== НАСТОЯЩИЙ ПОИСК ЗАЯВОК КЛИЕНТОВ ===")
          print(f"Городов: {len(cities)}")
          print(
              f"Запросов на город: "
              f"{len(query_templates)}"
          )
          print(
              f"Всего поисковых запросов: "
              f"{len(cities) * len(query_templates)}"
          )

          for city in cities:
              for template in query_templates:

                  query = (
                      "site:facebook.com "
                      + template.format(city=city)
                  )

                  print(f"\nПоиск: {query}")

                  try:
                      data = search_web(query)
                  except Exception as exc:
                      print(f"Ошибка поиска: {exc}")
                      time.sleep(2)
                      continue

                  results = data.get("results", [])

                  print(
                      f"Результатов: {len(results)}"
                  )

                  for item in results:

                      title = item.get("title", "")
                      snippet = item.get("snippet", "")
                      url = item.get("url", "")

                      if not url:
                          continue

                      parsed = urlsplit(url)

                      normalized_url = urlunsplit(
                          (
                              parsed.scheme,
                              parsed.netloc,
                              parsed.path,
                              "",
                              ""
                          )
                      )

                      if normalized_url in seen_urls:
                          continue

                      seen_urls.add(normalized_url)
                      total_results += 1

                      text = f"{title} {snippet}"

                      result = analyze_ad(text)

                      if result["match"]:
                          matches.append(
                              {
                                  "city": city,
                                  "title": title,
                                  "snippet": snippet,
                                  "url": url,
                              }
                          )
                      else:
                          reason_counts[
                              result["reason"]
                          ] += 1

                  time.sleep(2)

          print("\n=== ИТОГ ПОИСКА ===")
          print(
              f"Уникальных результатов: "
              f"{total_results}"
          )
          print(
              f"Подходящих заявок: "
              f"{len(matches)}"
          )

          print("\n=== РЕАЛЬНЫЕ ЗАЯВКИ ===")

          for item in matches:
              print("\n--- ЗАЯВКА ---")
              print(
                  f"Город: {item['city']}"
              )
              print(
                  f"Заголовок: {item['title']}"
              )
              print(
                  f"Описание: {item['snippet']}"
              )
              print(
                  f"Ссылка: {item['url']}"
              )

          print("\n=== ПРИЧИНЫ ОТКЛОНЕНИЯ ===")

          if reason_counts:
              for reason, count in reason_counts.most_common():
                  print(
                      f"{count} — {reason}"
                  )
          else:
              print(
                  "Нет отклонённых результатов."
              )

          print(
              "\n=== ЭТАП 1: "
              "МНОГОЗАПРОСНЫЙ ПОИСК ЗАВЕРШЁН ==="
          )
          PY
