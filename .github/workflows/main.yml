name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Проверка классификатора
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              ("Сантехник", "Нужен сантехник, течёт труба", True),
              ("Электрик", "Ищу электрика, не работает розетка", True),
              ("Плиточник", "Посоветуйте плиточника для ванной", True),
              ("Мебель", "Нужно собрать шкаф в квартире", True),
              ("Бытовая техника", "Не работает стиральная машина, нужен мастер", True),
              ("Аренда", "Сдам квартиру в Святом Власе посуточно", False),
              ("Продажа", "Продам апартаменты в Солнечном берегу", False),
              ("Вакансия", "Требуется сантехник. Работа официальная.", False),
              ("Реклама", "Сантехник, оказываю услуги по ремонту", False)
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"{name}: {actual}")

              if actual != expected:
                  raise AssertionError(
                      f"Ошибка в тесте: {name}"
                  )

          print("=== КЛАССИФИКАТОР РАБОТАЕТ ===")
          PY

      - name: Поиск и проверка реальных Facebook-публикаций
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import (
              search_web,
              run_agent,
              analyze_ad,
              is_fresh_date
          )

          from collections import Counter
          from urllib.parse import urlsplit, urlunsplit

          import json
          import time

          CITIES = [
              "Солнечный берег",
              "Святой Влас",
              "Равда",
              "Бургас",
              "Созополь",
              "Приморско",
              "Варна"
          ]

          SEARCHES = [
              '"{city}" нужен мастер',
              '"{city}" ищу мастера',
              '"{city}" нужен сантехник',
              '"{city}" ищу сантехника',
              '"{city}" нужен электрик',
              '"{city}" ищу электрика',
              '"{city}" нужен плиточник',
              '"{city}" ищу плиточника',
              '"{city}" нужен строитель',
              '"{city}" ремонт квартиры',
              '"{city}" мелкий ремонт',
              '"{city}" установка',
              '"{city}" монтаж',
              '"{city}" нужно заменить',
              '"{city}" нужно установить',
              '"{city}" нужно починить',
              '"{city}" не работает',
              '"{city}" сломался',
              '"{city}" протечка',
              '"{city}" сантехника',
              '"{city}" электрика',
              '"{city}" кондиционер',
              '"{city}" бойлер',
              '"{city}" бытовая техника'
          ]

          REJECT_TERMS = [
              "оказываю услуги",
              "предлагаю услуги",
              "мои услуги",
              "услуги мастера",
              "вакансия",
              "требуется сотрудник",
              "сдам",
              "сдаю",
              "аренда",
              "продам",
              "продажа",
              "недвижимость"
          ]

          CITY_ALIASES = {
              "Солнечный берег": [
                  "солнечный берег",
                  "sunny beach"
              ],
              "Святой Влас": [
                  "святой влас",
                  "свети влас"
              ],
              "Равда": [
                  "равда"
              ],
              "Бургас": [
                  "бургас"
              ],
              "Созополь": [
                  "созополь",
                  "созопол"
              ],
              "Приморско": [
                  "приморско"
              ],
              "Варна": [
                  "варна"
              ]
          }

          candidates = {}
          rejected = Counter()
          final_matches = []

          search_errors = 0
          agent_errors = 0

          print("=== НОВЫЙ ПОИСК ===")
          print("Период: последние 5 дней")
          print(f"Городов: {len(CITIES)}")
          print(f"Запросов на город: {len(SEARCHES)}")

          for city in CITIES:

              for template in SEARCHES:

                  query = (
                      "site:facebook.com "
                      + template.format(city=city)
                      + ' -"оказываю услуги"'
                      + ' -"предлагаю услуги"'
                      + ' -"мои услуги"'
                      + ' -"услуги мастера"'
                      + ' -"сдам"'
                      + ' -"сдаю"'
                      + ' -"аренда"'
                      + ' -"продам"'
                      + ' -"продажа"'
                      + ' -"недвижимость"'
                  )

                  try:
                      data = search_web(
                          query,
                          recency_minutes=7200
                      )

                  except Exception as exc:
                      search_errors += 1
                      print(
                          f"Ошибка поиска: {exc}"
                      )
                      continue

                  for item in data.get(
                      "results",
                      []
                  ):

                      url = item.get(
                          "url",
                          ""
                      )

                      if not url:
                          continue

                      if "facebook.com" not in url.lower():
                          continue

                      bad_parts = [
                          "/marketplace/",
                          "/events/",
                          "/watch/",
                          "/reels/",
                          "/videos/"
                      ]

                      if any(
                          part in url.lower()
                          for part in bad_parts
                      ):
                          continue

                      parsed = urlsplit(url)

                      normalized = urlunsplit(
                          (
                              parsed.scheme,
                              parsed.netloc,
                              parsed.path,
                              "",
                              ""
                          )
                      )

                      if normalized in candidates:
                          continue

                      candidates[normalized] = {
                          "city": city,
                          "url": url,
                          "title": item.get(
                              "title",
                              ""
                          ),
                          "snippet": item.get(
                              "snippet",
                              ""
                          )
                      }

                  time.sleep(1)

          print(
              f"\nКандидатов найдено: "
              f"{len(candidates)}"
          )

          AGENT_GOAL = """
          Ты проверяешь конкретный результат поиска Facebook.

          Открой ИМЕННО переданный URL.

          Тебе запрещено:
          - использовать другой пост;
          - использовать комментарии других постов;
          - использовать соседние рекомендации Facebook;
          - переносить текст из другого результата;
          - придумывать отсутствующую информацию.

          Если URL открывает группу или список публикаций,
          найди публикацию, которая соответствует
          исходному результату поиска.

          Нам нужна ТОЛЬКО основная публикация автора.

          Проверь:
          1. дату публикации;
          2. автора;
          3. название группы;
          4. город или место;
          5. полный основной текст публикации.

          Нам нужна публикация не старше 5 дней.

          Нам нужна именно заявка клиента:
          человек ищет мастера или просит выполнить
          ремонтную/бытовую работу.

          НЕ подходят:
          - реклама мастера;
          - предложение услуг;
          - вакансия;
          - продажа;
          - аренда;
          - недвижимость;
          - новости;
          - советы без конкретной потребности;
          - комментарий к чужой публикации.

          Верни только JSON:

          {
            "ok": true,
            "is_original_post": true,
            "published_date": "YYYY-MM-DDTHH:MM:SS+00:00",
            "author": "",
            "group_name": "",
            "location": "",
            "post_text": "",
            "is_client_request": true,
            "work_type": "",
            "summary": ""
          }

          Если проверить исходную публикацию невозможно:

          {
            "ok": false,
            "is_original_post": false,
            "published_date": null,
            "author": "",
            "group_name": "",
            "location": "",
            "post_text": "",
            "is_client_request": false,
            "work_type": "",
            "summary": ""
          }

          НИКОГДА не придумывай дату.
          НИКОГДА не используй текст из сниппета,
          если его нет в самой публикации.
          """

          print(
              "\n=== ПРОВЕРКА САМИХ ПУБЛИКАЦИЙ ==="
          )

          for number, candidate in enumerate(
              candidates.values(),
              start=1
          ):

              print(
                  f"\nПубликация "
                  f"{number}/{len(candidates)}"
              )

              try:
                  result = run_agent(
                      candidate["url"],
                      AGENT_GOAL,
                      timeout=120
                  )

              except Exception as exc:
                  agent_errors += 1
                  rejected[
                      "Ошибка TinyFish Agent"
                  ] += 1
                  print(
                      f"Ошибка агента: {exc}"
                  )
                  continue

              if not result.get(
                  "ok",
                  False
              ):
                  rejected[
                      "Публикацию нельзя проверить"
                  ] += 1
                  continue

              if not result.get(
                  "is_original_post",
                  False
              ):
                  rejected[
                      "Не исходный пост"
                  ] += 1
                  continue

              published_date = result.get(
                  "published_date"
              )

              if not published_date:
                  rejected[
                      "Нет подтверждённой даты"
                  ] += 1
                  continue

              if not is_fresh_date(
                  published_date,
                  days=5
              ):
                  rejected[
                      "Старше 5 дней"
                  ] += 1
                  continue

              post_text = str(
                  result.get(
                      "post_text",
                      ""
                  )
              ).strip()

              if not post_text:
                  rejected[
                      "Нет текста исходного поста"
                  ] += 1
                  continue

              lower_text = post_text.lower()

              if any(
                  term in lower_text
                  for term in REJECT_TERMS
              ):
                  rejected[
                      "Реклама или нежелательный тип публикации"
                  ] += 1
                  continue

              if not result.get(
                  "is_client_request",
                  False
              ):
                  rejected[
                      "Не заявка клиента"
                  ] += 1
                  continue

              analysis = analyze_ad(
                  post_text
              )

              if not analysis["match"]:
                  rejected[
                      analysis["reason"]
                  ] += 1
                  continue

              location_text = " ".join(
                  [
                      str(
                          result.get(
                              "location",
                              ""
                          )
                      ),
                      str(
                          result.get(
                              "group_name",
                              ""
                          )
                      ),
                      post_text
                  ]
              ).lower()

              city = candidate["city"]

              if not any(
                  alias in location_text
                  for alias in CITY_ALIASES[city]
              ):
                  rejected[
                      "Город не подтверждён"
                  ] += 1
                  continue

              final_matches.append(
                  {
                      "city": city,
                      "date": published_date,
                      "author": result.get(
                          "author",
                          ""
                      ),
                      "group": result.get(
                          "group_name",
                          ""
                      ),
                      "location": result.get(
                          "location",
                          ""
                      ),
                      "work_type": result.get(
                          "work_type",
                          ""
                      ),
                      "summary": result.get(
                          "summary",
                          ""
                      ),
                      "text": post_text,
                      "url": candidate["url"]
                  }
              )

          print(
              "\n=== ИТОГ ==="
          )

          print(
              f"Кандидатов: {len(candidates)}"
          )

          print(
              f"Ошибок поиска: {search_errors}"
          )

          print(
              f"Ошибок Agent: {agent_errors}"
          )

          print(
              f"РЕАЛЬНЫХ СВЕЖИХ ЗАЯВОК: "
              f"{len(final_matches)}"
          )

          print(
              "\n=== ЗАЯВКИ ==="
          )

          for item in final_matches:

              print("\n--- ЗАЯВКА ---")

              print(
                  f"Город: {item['city']}"
              )

              print(
                  f"Дата: {item['date']}"
              )

              print(
                  f"Автор: {item['author']}"
              )

              print(
                  f"Группа: {item['group']}"
              )

              print(
                  f"Локация: {item['location']}"
              )

              print(
                  f"Работа: {item['work_type']}"
              )

              print(
                  f"Кратко: {item['summary']}"
              )

              print(
                  f"Текст: {item['text']}"
              )

              print(
                  f"Ссылка: {item['url']}"
              )

          print(
              "\n=== ПРИЧИНЫ ОТКЛОНЕНИЯ ==="
          )

          for reason, count in (
              rejected.most_common()
          ):
              print(
                  f"{count} — {reason}"
              )

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final_matches,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "\n=== ПОИСК ЗАВЕРШЁН ==="
          )
          PY

      - name: Сохранение результатов
        uses: actions/upload-artifact@v4
        with:
          name: найденные-заявки
          path: results.json
          if-no-files-found: warn
