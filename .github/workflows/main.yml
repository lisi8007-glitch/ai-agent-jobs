name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Тестирование агента
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              (
                  "Заявка на замену смесителя",
                  "Нужно заменить смеситель в квартире",
                  True
              ),
              (
                  "Поиск мастера для плитки",
                  "Ищу мастера для укладки плитки",
                  True
              ),
              (
                  "Заявка сантехнику",
                  "Нужен сантехник, течёт труба",
                  True
              ),
              (
                  "Вакансия сантехника",
                  "Требуется сантехник. Работа официальная.",
                  False
              ),
              (
                  "Мастер предлагает услуги",
                  "Сантехник: оказываю услуги по ремонту",
                  False
              )
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"\n{name}")
              print(f"Текст: {text}")
              print(f"Результат агента: {actual}")
              print(f"Ожидалось: {expected}")

              if actual != expected:
                  raise AssertionError(
                      f"ОШИБКА: {name}. Получено {actual}, ожидалось {expected}"
                  )

          print("\n=== ВСЕ ТЕСТЫ ПРОЙДЕНЫ ===")
          PY
      - name: Проверка реального поиска TinyFish
        env:
                TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
            python - <<'PY'
            from agent import search_web
            import json

            query = 'site:facebook.com "Солнечный берег" "Святой Влас" Болгария мастер ремонт сантехник квартира'

            print("=== ЗАПРОС TINYFISH ===")
            print(query)

            data = search_web(query)

            print("\n=== РЕЗУЛЬТАТ TINYFISH ===")
            print(json.dumps(data, ensure_ascii=False, indent=2)[:12000])

            results = data.get("results", [])

            print(f"\nНайдено результатов: {len(results)}")

            if not results:
                raise RuntimeError("TinyFish не вернул результатов")

            print("\n=== ПОИСК РАБОТАЕТ ===")
            PY
