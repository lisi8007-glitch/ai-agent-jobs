name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Тестирование классификатора
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              (
                  "Сантехник",
                  "Нужен сантехник, течёт труба",
                  True
              ),
              (
                  "Электрик",
                  "Ищу электрика, не работает розетка",
                  True
              ),
              (
                  "Плиточник",
                  "Посоветуйте плиточника для ванной",
                  True
              ),
              (
                  "Бытовая техника",
                  "Не работает стиральная машина, нужен мастер",
                  True
              ),
              (
                  "Аренда",
                  "Сдам квартиру в Святом Власе посуточно",
                  False
              ),
              (
                  "Продажа",
                  "Продам апартаменты в Солнечном берегу",
                  False
              ),
              (
                  "Вакансия",
                  "Требуется сантехник. Работа официальная.",
                  False
              ),
              (
                  "Реклама мастера",
                  "Сантехник, оказываю услуги по ремонту",
                  False
              )
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"\n{name}")
              print(f"Результат: {actual}")
              print(f"Ожидалось: {expected}")

              if actual != expected:
                  raise AssertionError(
                      f"Ошибка: {name}. "
                      f"Получено {actual}, "
                      f"ожидалось {expected}"
                  )

          print(
              "\n=== ТЕСТЫ КЛАССИФИКАТОРА ПРОЙДЕНЫ ==="
          )
          PY

      - name: Поиск свежих кандидатов
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import (
              search_web,
              fetch_web,
              analyze_ad,
              is_facebook_post_url,
              get_fetched_text,
              get_fetched_url,
              extract_result_date,
              is_fresh_date
          )

          from collections import Counter
          from urllib.parse import urlsplit, urlunsplit

          import time

          cities = [
              "Солнечный берег",
              "Святой Влас",
              "Равда",
              "Бургас",
              "Созополь",
              "Приморско",
              "Варна"
          ]

          query_templates = [
              '"{city}" "нужен сантехник"',
              '"{city}" "ищу сантехника"',
              '"{city}" "нужен электрик"',
              '"{city}" "ищу электрика"',
              '"{city}" "нужен плиточник"',
              '"{city}" "ищу плиточника"',
              '"{city}" "нужен мастер" ремонт',
              '"{city}" "ищу мастера" ремонт',
              '"{city}" "посоветуйте мастера"',
              '"{city}" "подскажите мастера"',
              '"{city}" "кто может" ремонт',
              '"{city}" "не работает" мастер',
              '"{city}" "сломался" мастер',
              '"{city}" "нужен мастер" мебель',
              '"{city}" "нужен мастер" двери',
              '"{city}" "нужен мастер" окна',
              '"{city}" "нужен мастер" кондиционер',
              '"{city}" "нужен мастер" бойлер',
              '"{city}" "нужен мастер" бытовая техника',
              '"{city}" "нужно заменить"',
              '"{city}" "нужно установить"',
              '"{city}" "нужно починить"',
              '"{city}" "нужно отремонтировать"'
          ]

          seen_urls = set()
          candidates = []
          matches = []

          rejected = Counter()

          search_errors = 0
          fetch_errors = 0
          old_results = 0
          unknown_dates = 0

          print(
              "=== ПОИСК СВЕЖИХ ЗАЯВОК ==="
          )

          print(
              "Период: последние 5 дней"
          )

          print(
              f"Городов: {len(cities)}"
          )

          print(
              f"Запросов на город: "
              f"{len(query_templates)}"
          )

          for city in cities:

              for template in query_templates:

                  query = (
                      "site:facebook.com "
                      + template.format(city=city)
                      + ' -"оказываю услуги"'
                      + ' -"предлагаю услуги"'
                      + ' -"мои услуги"'
                      + ' -"услуги мастера"'
                      + ' -"сдам"'
                      + ' -"сдаю"'
                      + ' -"аренда"'
                      + ' -"продам"'
                      + ' -"продажа"'
                      + ' -"недвижимость"'
                  )

                  print(
                      f"\nПоиск: {query}"
                  )

                  try:
                      data = search_web(
                          query,
                          recency_minutes=7200
                      )

                  except Exception as exc:
                      search_errors += 1
                      print(
                          f"Ошибка поиска: {exc}"
                      )
                      continue

                  results = data.get(
                      "results",
                      []
                  )

                  for item in results:

                      url = item.get(
                          "url",
                          ""
                      )

                      if not is_facebook_post_url(
                          url
                      ):
                          continue

                      result_date = (
                          extract_result_date(
                              item
                          )
                      )

                      if result_date:
                          if not is_fresh_date(
                              result_date,
                              days=5
                          ):
                              old_results += 1
                              continue

                      normalized = urlunsplit(
                          (
                              urlsplit(url).scheme,
                              urlsplit(url).netloc,
                              urlsplit(url).path,
                              "",
                              ""
                          )
                      )

                      if normalized in seen_urls:
                          continue

                      seen_urls.add(
                          normalized
                      )

                      candidates.append(
                          {
                              "city": city,
                              "url": url,
                              "search_date":
                                  result_date.isoformat()
                                  if result_date
                                  else ""
                          }
                      )

                  time.sleep(2)

          print(
              f"\nКандидатов на Fetch: "
              f"{len(candidates)}"
          )

          for start in range(
              0,
              len(candidates),
              10
          ):

              batch = candidates[
                  start:start + 10
              ]

              urls = [
                  item["url"]
                  for item in batch
              ]

              print(
                  f"\nПроверяем "
                  f"{start + 1}-"
                  f"{start + len(batch)}"
              )

              try:
                  fetched = fetch_web(
                      urls
                  )

              except Exception as exc:
                  fetch_errors += len(
                      batch
                  )

                  print(
                      f"Ошибка Fetch: {exc}"
                  )

                  continue

              fetched_results = (
                  fetched.get(
                      "results",
                      []
                  )
              )

              fetched_map = {}

              for item in fetched_results:

                  item_url = get_fetched_url(
                      item
                  )

                  if item_url:
                      fetched_map[
                          item_url
                      ] = item

                  else:
                      item_url = item.get(
                          "url",
                          ""
                      )

                      if item_url:
                          fetched_map[
                              item_url
                          ] = item

              for candidate in batch:

                  url = candidate["url"]
                  city = candidate["city"]

                  page = (
                      fetched_map.get(url)
                  )

                  if not page:

                      parsed_target = urlsplit(
                          url
                      )

                      for key, value in (
                          fetched_map.items()
                      ):

                          parsed_key = urlsplit(
                              key
                          )

                          if (
                              parsed_key.netloc
                              == parsed_target.netloc
                              and
                              parsed_key.path
                              == parsed_target.path
                          ):
                              page = value
                              break

                  if not page:
                      rejected[
                          "Fetch не вернул страницу"
                      ] += 1
                      continue

                  text = get_fetched_text(
                      page
                  )

                  if not text:
                      rejected[
                          "Нет текста настоящего поста"
                      ] += 1
                      continue

                  result = analyze_ad(
                      text
                  )

                  if not result["match"]:

                      rejected[
                          result["reason"]
                      ] += 1

                      continue

                  city_names = [
                      "солнечный берег",
                      "святой влас",
                      "свети влас",
                      "равда",
                      "бургас",
                      "созополь",
                      "созопол",
                      "приморско",
                      "варна",
                      "несебр",
                      "несебър"
                  ]

                  text_lower = text.lower()

                  if not any(
                      name in text_lower
                      for name in city_names
                  ):

                      rejected[
                          "Локация не подтверждена"
                      ] += 1

                      continue

                  matches.append(
                      {
                          "city": city,
                          "title": page.get(
                              "title",
                              ""
                          ),
                          "text": text[:4000],
                          "url": url,
                          "date":
                              candidate[
                                  "search_date"
                              ] or "подтверждается Search"
                      }
                  )

              time.sleep(2)

          print(
              "\n=== ИТОГ ==="
          )

          print(
              f"Кандидатов: "
              f"{len(candidates)}"
          )

          print(
              f"Старых результатов отброшено: "
              f"{old_results}"
          )

          print(
              f"Неизвестных дат: "
              f"{unknown_dates}"
          )

          print(
              f"Ошибок поиска: "
              f"{search_errors}"
          )

          print(
              f"Ошибок Fetch: "
              f"{fetch_errors}"
          )

          print(
              f"РЕАЛЬНЫХ ЗАЯВОК: "
              f"{len(matches)}"
          )

          print(
              "\n=== РЕАЛЬНЫЕ ЗАЯВКИ ==="
          )

          for item in matches:

              print(
                  "\n--- ЗАЯВКА ---"
              )

              print(
                  f"Город: {item['city']}"
              )

              print(
                  f"Дата: {item['date']}"
              )

              print(
                  f"Заголовок: "
                  f"{item['title']}"
              )

              print(
                  f"Текст: "
                  f"{item['text']}"
              )

              print(
                  f"Ссылка: "
                  f"{item['url']}"
              )

          print(
              "\n=== ПРИЧИНЫ ОТКЛОНЕНИЯ ==="
          )

          for reason, count in (
              rejected.most_common()
          ):

              print(
                  f"{count} — {reason}"
              )

          print(
              "\n=== ПРОВЕРКА ЗАВЕРШЕНА ==="
          )
          PY
