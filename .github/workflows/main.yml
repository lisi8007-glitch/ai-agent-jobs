name: Тестирование ИИ-агента

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Тестирование классификатора
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import analyze_ad

          tests = [
              (
                  "Сантехник",
                  "Нужен сантехник, течёт труба",
                  True
              ),
              (
                  "Электрик",
                  "Ищу электрика, не работает розетка",
                  True
              ),
              (
                  "Плиточник",
                  "Посоветуйте плиточника для ванной",
                  True
              ),
              (
                  "Бытовая техника",
                  "Не работает стиральная машина, нужен мастер",
                  True
              ),
              (
                  "Аренда",
                  "Сдам квартиру в Святом Власе посуточно",
                  False
              ),
              (
                  "Продажа",
                  "Продам апартаменты в Солнечном берегу",
                  False
              ),
              (
                  "Вакансия",
                  "Требуется сантехник. Работа официальная.",
                  False
              ),
              (
                  "Реклама мастера",
                  "Сантехник, оказываю услуги по ремонту",
                  False
              )
          ]

          for name, text, expected in tests:
              result = analyze_ad(text)
              actual = result["match"]

              print(f"\n{name}")
              print(f"Результат: {actual}")
              print(f"Ожидалось: {expected}")

              if actual != expected:
                  raise AssertionError(
                      f"Ошибка: {name}. "
                      f"Получено {actual}, "
                      f"ожидалось {expected}"
                  )

          print(
              "\n=== ТЕСТЫ КЛАССИФИКАТОРА ПРОЙДЕНЫ ==="
          )
          PY

      - name: Поиск свежих кандидатов
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from agent import (
              search_web,
              run_agent,
              analyze_ad,
              is_facebook_candidate,
              is_fresh_date
          )

          from collections import Counter
          from urllib.parse import urlsplit, urlunsplit

          import time

          cities = [
              "Солнечный берег",
              "Святой Влас",
              "Равда",
              "Бургас",
              "Созополь",
              "Приморско",
              "Варна"
          ]

          query_templates = [
              '"{city}" "нужен сантехник"',
              '"{city}" "ищу сантехника"',
              '"{city}" "нужен электрик"',
              '"{city}" "ищу электрика"',
              '"{city}" "нужен плиточник"',
              '"{city}" "ищу плиточника"',
              '"{city}" "нужен мастер" ремонт',
              '"{city}" "ищу мастера" ремонт',
              '"{city}" "посоветуйте мастера"',
              '"{city}" "подскажите мастера"',
              '"{city}" "кто может" ремонт',
              '"{city}" "не работает" мастер',
              '"{city}" "сломался" мастер',
              '"{city}" "нужен мастер" мебель',
              '"{city}" "нужен мастер" двери',
              '"{city}" "нужен мастер" окна',
              '"{city}" "нужен мастер" кондиционер',
              '"{city}" "нужен мастер" бойлер',
              '"{city}" "нужен мастер" бытовая техника',
              '"{city}" "нужен мастер" мелкий ремонт',
              '"{city}" "нужно заменить"',
              '"{city}" "нужно установить"',
              '"{city}" "нужно починить"',
              '"{city}" "нужно отремонтировать"'
          ]

          seen_urls = set()
          candidates = []
          matches = []

          rejected = Counter()

          search_errors = 0
          agent_errors = 0

          print(
              "=== ПОИСК СВЕЖИХ ЗАЯВОК ==="
          )

          print(
              "Период: последние 5 дней"
          )

          print(
              f"Городов: {len(cities)}"
          )

          print(
              f"Запросов на город: "
              f"{len(query_templates)}"
          )

          total_queries = (
              len(cities)
              * len(query_templates)
          )

          print(
              f"Всего поисковых запросов: "
              f"{total_queries}"
          )

          for city in cities:

              for template in query_templates:

                  query = (
                      "site:facebook.com/groups/ "
                      + template.format(city=city)
                      + ' -"оказываю услуги"'
                      + ' -"предлагаю услуги"'
                      + ' -"мои услуги"'
                      + ' -"услуги мастера"'
                      + ' -"сдам"'
                      + ' -"сдаю"'
                      + ' -"аренда"'
                      + ' -"продам"'
                      + ' -"продажа"'
                      + ' -"недвижимость"'
                  )

                  print(
                      f"\nПоиск: {query}"
                  )

                  try:
                      data = search_web(
                          query,
                          recency_minutes=7200
                      )

                  except Exception as exc:
                      search_errors += 1

                      print(
                          f"Ошибка поиска: {exc}"
                      )

                      time.sleep(3)
                      continue

                  results = data.get(
                      "results",
                      []
                  )

                  for item in results:

                      url = item.get(
                          "url",
                          ""
                      )

                      if not is_facebook_candidate(
                          url
                      ):
                          continue

                      parsed = urlsplit(url)

                      normalized = (
                          urlunsplit(
                              (
                                  parsed.scheme,
                                  parsed.netloc,
                                  parsed.path,
                                  "",
                                  ""
                              )
                          )
                      )

                      if normalized in seen_urls:
                          continue

                      seen_urls.add(
                          normalized
                      )

                      candidates.append(
                          {
                              "city": city,
                              "url": url
                          }
                      )

                  time.sleep(2)

          print(
              f"\nКандидатов для TinyFish Agent: "
              f"{len(candidates)}"
          )

          goal = """
          Открой именно этот URL Facebook.

          Очень важно:
          не используй результаты поиска;
          не используй соседние или рекомендуемые публикации;
          не используй комментарии других публикаций;
          не используй другие посты группы.

          Найди именно исходную публикацию,
          которую открывает данный URL.

          Проверь верхнюю часть самой публикации:
          автор,
          название группы,
          дату публикации,
          основной текст публикации.

          Верни ТОЛЬКО JSON следующего вида:

          {
            "accessible": true,
            "is_original_post": true,
            "published_date": "YYYY-MM-DDTHH:MM:SS+00:00",
            "author": "имя автора",
            "group_name": "название группы",
            "location": "город или место, если указано",
            "post_text": "полный основной текст исходной публикации",
            "is_client_request": true,
            "summary": "кратко, какая работа нужна клиенту"
          }

          Если страницу нельзя открыть, верни:

          {
            "accessible": false,
            "is_original_post": false,
            "published_date": null,
            "author": "",
            "group_name": "",
            "location": "",
            "post_text": "",
            "is_client_request": false,
            "summary": ""
          }

          Дату указывай в ISO 8601.
          Не придумывай дату.

          is_client_request = true только если
          автор публикации действительно ищет мастера
          или просит выполнить ремонтную/бытовую работу.

          Рекламу мастера, вакансию, продажу,
          аренду, недвижимость и информационные
          публикации помечай как false.
          """

          for index, candidate in enumerate(
              candidates,
              start=1
          ):

              print(
                  f"\n=== ПРОВЕРКА ПОСТА "
                  f"{index}/{len(candidates)} ==="
              )

              print(
                  f"URL: {candidate['url']}"
              )

              try:
                  result = run_agent(
                      candidate["url"],
                      goal,
                      timeout=120
                  )

              except Exception as exc:
                  agent_errors += 1

                  print(
                      f"Ошибка TinyFish Agent: {exc}"
                  )

                  rejected[
                      "Ошибка открытия публикации"
                  ] += 1

                  continue

              if not result.get(
                  "accessible",
                  False
              ):
                  rejected[
                      "Публикация недоступна для проверки"
                  ] += 1
                  continue

              if not result.get(
                  "is_original_post",
                  False
              ):
                  rejected[
                      "Это не исходная публикация"
                  ] += 1
                  continue

              published_date = result.get(
                  "published_date"
              )

              if not published_date:
                  rejected[
                      "Не удалось определить дату публикации"
                  ] += 1
                  continue

              if not is_fresh_date(
                  published_date,
                  days=5
              ):
                  rejected[
                      "Публикация старше 5 дней"
                  ] += 1
                  continue

              post_text = result.get(
                  "post_text",
                  ""
              )

              if not isinstance(
                  post_text,
                  str
              ):
                  post_text = str(
                      post_text
                  )

              post_text = post_text.strip()

              if not post_text:
                  rejected[
                      "Не получен текст исходной публикации"
                  ] += 1
                  continue

              if not result.get(
                  "is_client_request",
                  False
              ):
                  rejected[
                      "Автор не ищет мастера"
                  ] += 1
                  continue

              analysis = analyze_ad(
                  post_text
              )

              if not analysis["match"]:
                  rejected[
                      analysis["reason"]
                  ] += 1
                  continue

              city = candidate["city"]

              location_text = " ".join(
                  [
                      str(
                          result.get(
                              "location",
                              ""
                          )
                      ),
                      str(
                          result.get(
                              "group_name",
                              ""
                          )
                      ),
                      post_text
                  ]
              ).lower()

              city_names = [
                  "солнечный берег",
                  "святой влас",
                  "свети влас",
                  "равда",
                  "бургас",
                  "созополь",
                  "созопол",
                  "приморско",
                  "варна",
                  "несебр",
                  "несебър"
              ]

              if not any(
                  name in location_text
                  for name in city_names
              ):
                  rejected[
                      "Локация не подтверждена"
                  ] += 1
                  continue

              matches.append(
                  {
                      "city": city,
                      "published_date":
                          published_date,
                      "author":
                          result.get(
                              "author",
                              ""
                          ),
                      "group_name":
                          result.get(
                              "group_name",
                              ""
                          ),
                      "location":
                          result.get(
                              "location",
                              ""
                          ),
                      "summary":
                          result.get(
                              "summary",
                              ""
                          ),
                      "text":
                          post_text,
                      "url":
                          candidate["url"]
                  }
              )

              print(
                  "+++ НАЙДЕНА РЕАЛЬНАЯ ЗАЯВКА +++"
              )

              print(
                  f"Город: {city}"
              )

              print(
                  f"Дата: {published_date}"
              )

              print(
                  f"Автор: "
                  f"{result.get('author', '')}"
              )

              print(
                  f"Группа: "
                  f"{result.get('group_name', '')}"
              )

              print(
                  f"Заявка: "
                  f"{result.get('summary', '')}"
              )

              print(
                  f"Ссылка: "
                  f"{candidate['url']}"
              )

          print(
              "\n=== ИТОГ ==="
          )

          print(
              f"Кандидатов: "
              f"{len(candidates)}"
          )

          print(
              f"Ошибок поиска: "
              f"{search_errors}"
          )

          print(
              f"Ошибок TinyFish Agent: "
              f"{agent_errors}"
          )

          print(
              f"РЕАЛЬНЫХ ЗАЯВОК: "
              f"{len(matches)}"
          )

          print(
              "\n=== РЕАЛЬНЫЕ СВЕЖИЕ ЗАЯВКИ ==="
          )

          for item in matches:

              print(
                  "\n--- ЗАЯВКА ---"
              )

              print(
                  f"Город: "
                  f"{item['city']}"
              )

              print(
                  f"Дата: "
                  f"{item['published_date']}"
              )

              print(
                  f"Автор: "
                  f"{item['author']}"
              )

              print(
                  f"Группа: "
                  f"{item['group_name']}"
              )

              print(
                  f"Локация: "
                  f"{item['location']}"
              )

              print(
                  f"Заявка: "
                  f"{item['summary']}"
              )

              print(
                  f"Текст: "
                  f"{item['text']}"
              )

              print(
                  f"Ссылка: "
                  f"{item['url']}"
              )

          print(
              "\n=== ПРИЧИНЫ ОТКЛОНЕНИЯ ==="
          )

          for reason, count in (
              rejected.most_common()
          ):

              print(
                  f"{count} — {reason}"
              )

          print(
              "\n=== ПРОВЕРКА ЗАВЕРШЕНА ==="
          )
          PY
